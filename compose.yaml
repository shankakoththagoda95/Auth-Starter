services:
  db:
    image: postgres:17-alpine
    container_name: auth-starter-db
    environment:
      POSTGRES_DB: auth_starter
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: local-development-password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_starter"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: auth-starter-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
